server {
    listen 80;
    server_name portal.engineeredpsychology.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name portal.engineeredpsychology.com;

    ssl_certificate /etc/letsencrypt/live/portal.engineeredpsychology.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal.engineeredpsychology.com/privkey.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;
    }
}
