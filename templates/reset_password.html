{% extends "base.html" %}

{% block title %}Choose New Password{% endblock %}

{% block content %}
  <section class="login-shell">
    <div class="login-copy">
      <h1>Engineered Psychology</h1>
      <p class="brand-subline">by TMG Psychology</p>
      <p>Choose a new password for your secure client portal account.</p>
    </div>

    <div class="auth-stack">
      <form class="auth-panel" method="post" action="{{ url_for('reset_password', token=token) }}">
        <div class="auth-heading">
          <p class="eyebrow">Secure reset</p>
          <h2>New password</h2>
        </div>
        <label>
          <span>New password</span>
          <span class="password-field">
            <input type="password" name="password" autocomplete="new-password" required data-password-input>
            <button type="button" class="reveal-button" data-password-toggle>Show</button>
          </span>
        </label>
        <label>
          <span>Confirm new password</span>
          <span class="password-field">
            <input type="password" name="confirm_password" autocomplete="new-password" required data-password-input>
            <button type="button" class="reveal-button" data-password-toggle>Show</button>
          </span>
        </label>
        <button class="primary-button" type="submit">Update password</button>
        <p class="auth-secondary">
          <a href="{{ url_for('login') }}">Back to sign in</a>
        </p>
      </form>
      <a class="therapist-login-link" href="{{ url_for('admin_login') }}">Therapist login</a>
    </div>
  </section>
{% endblock %}
