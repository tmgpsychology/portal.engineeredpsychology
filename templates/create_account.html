{% extends "base.html" %}

{% block title %}Create Account{% endblock %}

{% block content %}
  <section class="login-shell">
    <div class="login-copy">
      <h1>Engineered Psychology</h1>
      <p class="brand-subline">by TMG Psychology</p>
      <p>Create your secure account to access shared resources, session notes, and skills.</p>
    </div>

    <form class="auth-panel" method="post" action="{{ url_for('create_account') }}">
      <div class="auth-heading">
        <p class="eyebrow">New account</p>
        <h2>Create account</h2>
      </div>
      <label>
        <span>Full name</span>
        <input name="full_name" autocomplete="name" required>
      </label>
      <label>
        <span>Email</span>
        <input type="email" name="email" autocomplete="email" required>
      </label>
      <label>
        <span>Password</span>
        <input type="password" name="password" autocomplete="new-password" required>
      </label>
      <label>
        <span>Confirm password</span>
        <input type="password" name="confirm_password" autocomplete="new-password" required>
      </label>
      <button class="primary-button" type="submit">Create account</button>
      <p class="auth-secondary">
        Already have an account?
        <a href="{{ url_for('login') }}">Sign in</a>
      </p>
    </form>
  </section>
{% endblock %}
